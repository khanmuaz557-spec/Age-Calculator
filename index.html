<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বয়স ক্যালকুলেটর (Age Calculator)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: bold;
        }
        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #3498db;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #27ae60;
        }
        .result {
            margin-top: 20px;
            display: none;
            background: #e8f8f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #2ecc71;
        }
        .result p {
            margin: 8px 0;
            color: #2c3e50;
            font-size: 16px;
        }
        .ad-space {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            text-align: center;
            border: 1px dashed #ccc;
            border-radius: 6px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>বয়স ক্যালকুলেটর</h2>
    
    <div class="input-group">
        <label for="dob">আপনার জন্মতারিখ নির্বাচন করুন:</label>
        <input type="date" id="dob">
    </div>

    <button onclick="calculateAge()">বয়স হিসাব করুন</button>

    <div class="result" id="result">
        <p id="years-months-days"></p>
        <p id="total-days"></p>
        <p id="total-hours"></p>
    </div>

    <!-- বিজ্ঞাপনের স্থান (গুগল অ্যাডসেন্স কোড এখানে বসবে) -->
    <div class="ad-space">
        এখানে বিজ্ঞাপন প্রদর্শিত হবে (Google AdSense)
    </div>
</div>

<script>
    function calculateAge() {
        const dobInput = document.getElementById('dob').value;
        if (!dobInput) {
            alert('কৃপা করে একটি সঠিক জন্মতারিখ নির্বাচন করুন!');
            return;
        }

        const birthDate = new Date(dobInput);
        const today = new Date();

        if (birthDate > today) {
            alert('জন্মতারিখ বর্তমান তারিখের চেয়ে বেশি হতে পারে না!');
            return;
        }

        let years = today.getFullYear() - birthDate.getFullYear();
        let months = today.getMonth() - birthDate.getMonth();
        let days = today.getDate() - birthDate.getDate();

        if (days < 0) {
            months--;
            const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
            days += prevMonth.getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        const diffTime = Math.abs(today - birthDate);
        const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        const totalHours = totalDays * 24;

        document.getElementById('years-months-days').innerText = `আপনার বয়স: ${years} বছর, ${months} মাস, এবং ${days} দিন।`;
        document.getElementById('total-days').innerText = `মোট দিন: ${totalDays.toLocaleString('bn-BD')} দিন`;
        document.getElementById('total-hours').innerText = `মোট ঘণ্টা: ${totalHours.toLocaleString('bn-BD')} ঘণ্টা`;

        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
